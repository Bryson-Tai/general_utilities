version: "3"

tasks:
  ## OpenTofu Tasks
  tf:init:
    desc: OpenTofu init
    dir: opentofu/modules
    dotenv:
      - .env
    cmds:
      - tofu init -upgrade

  tf:plan:
    desc: OpenTofu plan
    dir: opentofu/modules
    deps:
      - tf:init
    dotenv:
      - .env
    cmds:
      - tofu plan

  tf:apply:
    desc: OpenTofu provision
    dir: opentofu/modules
    deps:
      - tf:init
    dotenv:
      - .env
    cmds:
      - tofu apply -auto-approve

  tf:destroy:
    desc: OpenTofu destroy
    dir: opentofu/modules
    deps:
      - tf:init
    dotenv:
      - .env
    cmds:
      - tofu destroy -auto-approve

  tf:refresh:
    desc: OpenTofu refresh statefile
    dir: opentofu/modules
    deps:
      - tf:init
    dotenv:
      - .env
    cmds:
      - tofu refresh

  tf:output:
    desc: OpenTofu view Output
    dir: opentofu/modules
    deps:
      - tf:init
    dotenv:
      - .env
    cmds:
      - tofu output
